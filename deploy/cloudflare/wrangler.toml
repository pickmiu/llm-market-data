name = "llm-market-data-scheduler"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_OWNER = "pickmiu"
GITHUB_REPO = "llm-market-data"
# 仅需配置 GitHub 个人访问令牌（具有 repo 与 workflow 调度权限）
# 支持在此处配置，或通过 Cloudflare 控制台配置环境变量 GITHUB_PAT：
GITHUB_PAT = ""

[triggers]
# Primary daily trigger at 00:30 UTC (08:30 Beijing)
crons = ["30 0 * * *"]

