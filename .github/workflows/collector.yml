name: OpenRouter Data Collector

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Optional: Number of days to look back (leave empty for auto inception backfill)'
        required: false
        default: ''
      max_requests:
        description: 'Maximum API requests for backfilling in this run'
        required: false
        default: '40'
  # schedule:
  #   # Secondary backup trigger: 01:30 UTC daily (commented to avoid duplicate daily runs with Cloudflare Worker)
  #   - cron: '30 1 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data synchronization
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          MAX_REQUESTS: ${{ github.event.inputs.max_requests || '40' }}
        run: |
          LOOKBACK_FLAG=""
          if [ -n "$LOOKBACK_DAYS" ]; then
            LOOKBACK_FLAG="--lookback-days $LOOKBACK_DAYS"
          fi
          python cli.py sync \
            $LOOKBACK_FLAG \
            --max-requests "$MAX_REQUESTS"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-sync openrouter market data [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
