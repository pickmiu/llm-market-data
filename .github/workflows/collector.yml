name: OpenRouter Data Collector

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Optional: Number of days to look back (leave empty for auto inception backfill)'
        required: false
        default: ''
      max_requests:
        description: 'Maximum API requests for backfilling in this run'
        required: false
        default: '40'
      generate_report:
        description: 'Optional: Force weekly report generation (automatically runs on Mondays if empty)'
        required: false
        default: ''
  # schedule:
  #   # Secondary backup trigger: 01:30 UTC daily (commented to avoid duplicate daily runs with Cloudflare Worker)
  #   - cron: '30 1 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data synchronization
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          MAX_REQUESTS: ${{ github.event.inputs.max_requests || '40' }}
        run: |
          LOOKBACK_FLAG=""
          if [ -n "$LOOKBACK_DAYS" ]; then
            LOOKBACK_FLAG="--lookback-days $LOOKBACK_DAYS"
          fi
          python cli.py sync \
            $LOOKBACK_FLAG \
            --max-requests "$MAX_REQUESTS"

      - name: Generate weekly top 5 models report (on Mondays or when requested)
        run: |
          DOW=$(date -u +%u)
          GEN_INPUT="${{ github.event.inputs.generate_report }}"
          echo "Current UTC Day of Week: $DOW (1=Monday), generate_report input: '$GEN_INPUT'"
          if [ "$GEN_INPUT" = "true" ] || [ "$DOW" -eq 1 -a "$GEN_INPUT" != "false" ]; then
            echo "[*] Trigger condition met. Generating weekly top 5 models report..."
            python report/generate_weekly_top5_report.py
          else
            echo "[*] Skipping weekly report generation."
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ report/
          if git diff --staged --quiet; then
            echo "No data or report changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "chore(data): auto-sync openrouter market data and weekly report [skip ci]"

          # Push with retry in case remote main moved
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin main; then
              echo "Successfully pushed changes to main."
              exit 0
            fi
            echo "Push failed, pulling latest remote changes and retrying ($i/$MAX_RETRIES)..."
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "Rebase conflict encountered; remote main already contains synced data. Skipping."
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1
