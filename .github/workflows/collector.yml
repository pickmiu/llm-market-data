name: OpenRouter Data Collector

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Optional: Number of days to look back (leave empty for auto inception backfill)'
        required: false
        default: ''
      max_requests:
        description: 'Maximum API requests for backfilling in this run'
        required: false
        default: '40'
      openrouter_api_key:
        description: 'Optional: OpenRouter API key passed dynamically from scheduler or trigger'
        required: false
        default: ''
  schedule:
    # Secondary backup trigger: 01:30 UTC daily
    - cron: '30 1 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mask sensitive input
        if: ${{ github.event.inputs.openrouter_api_key != '' }}
        run: echo "::add-mask::${{ github.event.inputs.openrouter_api_key }}"

      - name: Run data synchronization
        env:
          INPUT_KEY: ${{ github.event.inputs.openrouter_api_key }}
          SECRET_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          export OPENROUTER_API_KEY="${INPUT_KEY:-$SECRET_KEY}"
          LOOKBACK_FLAG=""
          if [ -n "${{ github.event.inputs.lookback_days }}" ]; then
            LOOKBACK_FLAG="--lookback-days ${{ github.event.inputs.lookback_days }}"
          fi
          python cli.py sync \
            $LOOKBACK_FLAG \
            --max-requests "${{ github.event.inputs.max_requests || '40' }}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-sync openrouter market data [skip ci]"
            git push origin main
          fi
